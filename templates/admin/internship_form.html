{% extends 'base.html' %}

{% block title %}Edit Placement - InternTrack{% endblock %}

{% block content %}
<section class="py-6 position-relative overflow-hidden min-vh-80 d-flex align-items-center">
    <div class="hero-blur-orb orb-1"></div>
    <div class="hero-blur-orb orb-2"></div>
    
    <div class="container position-relative z-2">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Back Link -->
                <div class="mb-4 text-start">
                    <a href="{{ url_for('admin.list_internships') }}" class="btn btn-outline-custom rounded-pill px-4 fs-7 py-2">
                        <i class="bi bi-arrow-left me-2"></i> Back to Review Hub
                    </a>
                </div>

                <div class="card glass-card border border-secondary-soft p-4 p-md-5">
                    <div class="border-bottom border-secondary-soft pb-3 mb-4 text-start">
                        <span class="badge bg-primary-soft text-primary-gradient mb-2 py-1 px-3 rounded-pill border border-primary-soft fw-semibold fs-8">
                            Internship Configuration
                        </span>
                        <h3 class="text-white fw-bold mb-1">Edit Placement Record</h3>
                        <p class="text-muted fs-7 mb-0">Configure placement attributes for <strong class="text-light">{{ internship.student.user.name }}</strong>.</p>
                    </div>

                    <form method="POST" class="text-start">
                        <!-- Company Selection -->
                        <div class="mb-3">
                            <label for="company_id" class="form-label text-light fs-7 fw-semibold">Employer / Organization <span class="text-danger">*</span></label>
                            <select class="form-select bg-dark-soft border-secondary-soft text-white" id="company_id" name="company_id" required>
                                <option value="">Select Company...</option>
                                {% for comp in companies %}
                                    <option value="{{ comp.id }}" {% if internship.company_id == comp.id %}selected{% endif %}>{{ comp.company_name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row g-3">
                            <!-- Job Role -->
                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label text-light fs-7 fw-semibold">Job Role <span class="text-danger">*</span></label>
                                <input type="text" class="form-control bg-dark-soft border-secondary-soft text-white" id="role" name="role" required value="{{ internship.role }}">
                            </div>

                            <!-- Format -->
                            <div class="col-md-6 mb-3">
                                <label for="internship_type" class="form-label text-light fs-7 fw-semibold">Format <span class="text-danger">*</span></label>
                                <select class="form-select bg-dark-soft border-secondary-soft text-white" id="internship_type" name="internship_type" required>
                                    <option value="online" {% if internship.internship_type == 'online' %}selected{% endif %}>Online</option>
                                    <option value="offline" {% if internship.internship_type == 'offline' %}selected{% endif %}>Offline</option>
                                    <option value="hybrid" {% if internship.internship_type == 'hybrid' %}selected{% endif %}>Hybrid</option>
                                </select>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label text-light fs-7 fw-semibold">Description</label>
                            <textarea class="form-control bg-dark-soft border-secondary-soft text-white" id="description" name="description" rows="3">{% if internship.description %}{{ internship.description }}{% endif %}</textarea>
                        </div>

                        <div class="row g-3">
                            <!-- Start Date -->
                            <div class="col-md-6 mb-3">
                                <label for="start_date" class="form-label text-light fs-7 fw-semibold">Start Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control bg-dark-soft border-secondary-soft text-white" id="start_date" name="start_date" required value="{{ internship.start_date.strftime('%Y-%m-%d') if internship.start_date else '' }}">
                            </div>

                            <!-- End Date -->
                            <div class="col-md-6 mb-3">
                                <label for="end_date" class="form-label text-light fs-7 fw-semibold">End Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control bg-dark-soft border-secondary-soft text-white" id="end_date" name="end_date" required value="{{ internship.end_date.strftime('%Y-%m-%d') if internship.end_date else '' }}">
                            </div>
                        </div>

                        <hr class="border-secondary-soft my-4">
                        <h6 class="text-white fw-bold mb-3"><i class="bi bi-person-badge text-primary-gradient me-2"></i>Supervisor Contact Details</h6>

                        <div class="row g-3">
                            <!-- Name -->
                            <div class="col-md-4 mb-3">
                                <label for="supervisor_name" class="form-label text-light fs-7 fw-semibold">Supervisor Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control bg-dark-soft border-secondary-soft text-white" id="supervisor_name" name="supervisor_name" required value="{{ internship.supervisor_name if internship.supervisor_name else '' }}">
                            </div>

                            <!-- Email -->
                            <div class="col-md-4 mb-3">
                                <label for="supervisor_email" class="form-label text-light fs-7 fw-semibold">Supervisor Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control bg-dark-soft border-secondary-soft text-white" id="supervisor_email" name="supervisor_email" required value="{{ internship.supervisor_email if internship.supervisor_email else '' }}">
                            </div>

                            <!-- Phone -->
                            <div class="col-md-4 mb-3">
                                <label for="supervisor_phone" class="form-label text-light fs-7 fw-semibold">Supervisor Phone</label>
                                <input type="text" class="form-control bg-dark-soft border-secondary-soft text-white" id="supervisor_phone" name="supervisor_phone" value="{{ internship.supervisor_phone if internship.supervisor_phone else '' }}">
                            </div>
                        </div>

                        <!-- Save button -->
                        <button type="submit" class="btn btn-primary-gradient w-100 rounded-pill mt-4 py-2.5 fw-bold">
                            Save Placement Record <i class="bi bi-save ms-1"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
