{% extends 'base.html' %}

{% block title %}Page Not Found - 404 - InternTrack{% endblock %}

{% block content %}
<section class="py-6 position-relative overflow-hidden min-vh-80 d-flex align-items-center">
    <div class="hero-blur-orb orb-1"></div>
    <div class="hero-blur-orb orb-2"></div>
    
    <div class="container position-relative z-2">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-9 text-center">
                <div class="card glass-card border border-warning-soft shadow-lg p-5">
                    <div class="brand-icon-wrapper bg-warning mx-auto mb-4" style="background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%) !important;">
                        <i class="bi bi-compass brand-icon"></i>
                    </div>
                    
                    <h1 class="text-white fw-bold mb-2">404 - Page Not Found</h1>
                    <p class="text-warning fw-semibold mb-4"><i class="bi bi-exclamation-circle-fill me-2"></i>RESOURCE NOT LOCATED</p>
                    
                    <p class="text-muted fs-6 mb-4 max-w-600 mx-auto">
                        The page or resource you are looking for does not exist or may have been moved.
                    </p>
                    
                    <div class="d-flex justify-content-center gap-3">
                        <a href="javascript:history.back()" class="btn btn-outline-custom rounded-pill px-4">
                            <i class="bi bi-arrow-left me-2"></i> Go Back
                        </a>
                        <a href="{{ url_for('main.index') }}" class="btn btn-primary-gradient rounded-pill px-4">
                            <i class="bi bi-house-door me-2"></i> Return Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
